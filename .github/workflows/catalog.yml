name: catalog

# On GitHub's hosted runners only. Regenerates CATALOG.md at the repository root on pushes
# to main that change tools, test records, or the generator, and pushes via a repo-scoped
# deploy key (CATALOG_DEPLOY_KEY). Forks without that secret generate the file and skip
# pushing cleanly. Commits touch only CATALOG.md, outside this workflow's path filter.

on:
  push:
    branches: [main]
    paths: ["tools/**", "results/**", "scripts/catalog.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.CATALOG_DEPLOY_KEY }}
      - run: python3 -I scripts/catalog.py --output CATALOG.md
      - env:
          HAS_DEPLOY_KEY: ${{ secrets.CATALOG_DEPLOY_KEY != '' }}
        run: |
          if git ls-files --error-unmatch CATALOG.md >/dev/null 2>&1 && git diff --quiet -- CATALOG.md; then
            echo "CATALOG.md is up to date"
            exit 0
          fi
          if [[ "$HAS_DEPLOY_KEY" != "true" ]]; then
            echo "CATALOG_DEPLOY_KEY is not set; skipping push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CATALOG.md
          git commit -m "Update CATALOG.md from tools and results"
          git pull --rebase origin main
          git push origin HEAD:main
