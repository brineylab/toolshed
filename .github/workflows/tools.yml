name: tools

# check: every pull request, on a hosted runner. build: a pull request that changes a tool,
# on the lab's runner, from a branch in this repository only. promote: a push to main that
# changes a tool, copying the tested candidate to its version tag.

on:
  pull_request:
  push:
    branches: [main]
    paths: ["tools/**"]

permissions:
  contents: read
  packages: write
  pull-requests: read

env:
  REGISTRY: ghcr.io

defaults:
  run:
    shell: bash

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.changed.outputs.tools }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch -q origin "$BASE_REF"
          echo "tools=$(scripts/changed-tools "origin/$BASE_REF...HEAD" | xargs)" >> "$GITHUB_OUTPUT"
      - run: python3 -I -m unittest discover tests
      - env:
          TOOLS: ${{ steps.changed.outputs.tools }}
        run: |
          [[ -n "$TOOLS" ]] || { echo "no tool changed"; exit 0; }
          dirs=(); for t in $TOOLS; do dirs+=("tools/$t"); done
          python3 -I scripts/check.py "${dirs[@]}" --registry "$REGISTRY/${GITHUB_REPOSITORY,,}"

  # Only a branch in this repository builds: only organization members can push one, so a
  # fork's pull request never runs on the lab's machine. A candidate whose pull request closes
  # unmerged stays in the registry as a dangling pr-<n> tag; delete it from the package's page
  # if it matters.
  build:
    needs: check
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.check.outputs.tools != ''
    runs-on: [self-hosted, builder]
    steps:
      - uses: actions/checkout@v7
      - env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: podman login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN"
      - env:
          TOOLS: ${{ needs.check.outputs.tools }}
          NUMBER: ${{ github.event.number }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          for t in $TOOLS; do
            IMAGE="$REGISTRY/${GITHUB_REPOSITORY,,}/$t:pr-$NUMBER"
            scripts/build "$t" "$IMAGE"
            podman push "$IMAGE"
            echo "candidate: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          done
      - if: always()
        run: podman image prune -f --filter until=168h

  promote:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y skopeo
      - env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: skopeo login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          NUMBER=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty')
          [[ -n "$NUMBER" ]] || { echo "$GITHUB_SHA has no pull request, so no candidate to promote" >&2; exit 1; }
          for t in $(scripts/changed-tools "$BEFORE" "$GITHUB_SHA"); do
            VERSION=$(python3 -I -c "import sys; sys.path.insert(0, 'scripts'); import check, pathlib; print(check.frontmatter(pathlib.Path('tools/$t/SKILL.md'))['metadata']['version'])")
            REPO="docker://$REGISTRY/${GITHUB_REPOSITORY,,}/$t"
            if skopeo inspect "$REPO:$VERSION" > /dev/null 2>&1; then
              echo "$t:$VERSION already published" >&2; exit 1
            fi
            skopeo copy --preserve-digests "$REPO:pr-$NUMBER" "$REPO:$VERSION"
            echo "published: \`${REPO#docker://}:$VERSION\` from pr-$NUMBER" >> "$GITHUB_STEP_SUMMARY"
          done
